apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-web
  namespace: d12-ingress
spec:
  ingressClassName: traefik
  tls:
  - hosts: [demo.local]
    secretName: demo-local-tls
  rules:
  - host: demo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: web, port: {number: 80}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api
  namespace: d12-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: d12-ingress-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: [demo.local]
    secretName: demo-local-tls
  rules:
  - host: demo.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service: {name: api, port: {number: 80}}
