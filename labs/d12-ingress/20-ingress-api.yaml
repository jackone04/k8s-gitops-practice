apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: d12-ingress
spec:
  stripPrefix:
    prefixes: ["/api"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api
  namespace: d12-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: d12-ingress-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: demo.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
