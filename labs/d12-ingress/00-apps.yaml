apiVersion: v1
kind: Namespace
metadata:
  name: d12-ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: d12-ingress
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.10.3
        args: ["--port", "8080", "--name", "web"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /health, port: 8080}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: d12-ingress
spec:
  selector: {app: web}
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: d12-ingress
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.10.3
        args: ["--port", "8080", "--name", "api"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /health, port: 8080}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: d12-ingress
spec:
  selector: {app: api}
  ports:
  - port: 80
    targetPort: 8080
