apiVersion: v1
kind: Namespace
metadata:
  name: d11
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: d11
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: d11
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: d11
  labels:
    app: client
spec:
  containers:
  - name: shell
    image: nicolaka/netshoot:v0.13
    command: ["sleep", "infinity"]
