apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-start-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-start-demo
  template:
    metadata:
      labels:
        app: slow-start-demo
    spec:
      containers:
      - name: demo
        image: nginx:1.27
        command: ["/bin/sh", "-c"]
        args:
          - "sleep 30 && nginx -g 'daemon off;'"
        startupProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
