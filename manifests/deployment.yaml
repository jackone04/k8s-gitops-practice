apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
      - name: nginx
        image: jackone04/nginx-demo:e2996f4648ab5e8873648cf9bb6ad2b7a2083f09
        ports:
        - containerPort: 80
