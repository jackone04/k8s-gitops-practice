apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
      - name: nginx
        image: jackone04/nginx-demo:74120fcc8d2f0980e5df5f3b156502c5c11ae24a
        ports:
        - containerPort: 80
