apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
      - name: nginx
        image: jackone04/nginx-demo:68191ead81d887ab0ab6a1d1192b9d0574920399
        ports:
        - containerPort: 80
