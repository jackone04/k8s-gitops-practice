apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
      - name: nginx
        image: jackone04/nginx-demo:dac561fa2a30ff3e1f63c3fb0475cb0f8b6af63f
        ports:
        - containerPort: 80
