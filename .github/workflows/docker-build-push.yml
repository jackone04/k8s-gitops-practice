name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  guard-no-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 拦截 latest 与未锁版本的镜像引用
        run: |
          set -e
          echo "--- 检查 1：显式 :latest"
          if grep -rn ':latest' app/Dockerfile*; then
            echo "::error::检测到 :latest，拦截"
            exit 1
          fi
          echo "--- 检查 2：FROM 未写版本号/digest"
          if grep -rnE '^\s*FROM\s+[^:@[:space:]]+(\s|$)' app/Dockerfile*; then
            echo "::error::FROM 未锁定版本，拦截"
            exit 1
          fi
          echo "OK：基础镜像已锁定版本"

  build-and-push:
    needs: guard-no-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx-demo:${{ github.sha }}

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update image tag in manifest
        env:
          SHA: ${{ github.sha }}
        run: |
          sed -i "s|jackone04/nginx-demo:.*|jackone04/nginx-demo:${SHA}|" \
            manifests/deployment.yaml
          echo "=== 验证替换结果 ==="
          grep 'image:' manifests/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/deployment.yaml
          git diff --cached --quiet || \
            git commit -m "ci: update image to ${{ github.sha }} [skip ci]"
          git push
